<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071719">
  <meta name="description" content="빛이 닿는 마지막 해역을 유영하는 3D 해저 탐험">
  <title>Afterlight · 잔광 해역</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%230c2827'/%3E%3Cpath d='M7 17q4-6 9 0t9 0t8 0M7 24q4-6 9 0t9 0t8 0' stroke='%23b4f5d1' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/afterlight/style.css">
</head>
<body>
  <header class="masthead">
    <div class="identity">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 12q4-5 8 0t8 0t8 0M4 19q4-5 8 0t8 0t8 0"/></svg></span>
      <div><strong>AFTERLIGHT</strong><span>잔광 해역</span></div>
    </div>
    <div class="toolbar">
      <button id="sound" class="quiet" type="button" aria-pressed="false"><span aria-hidden="true" class="sound-wave"><i></i><i></i><i></i><i></i></span><span id="sound-label">소리 꺼짐</span></button>
      <button id="help" class="quiet" type="button" aria-haspopup="dialog"><span class="question" aria-hidden="true">?</span> 조작법</button>
    </div>
  </header>

  <main>
    <section class="stage" id="stage" aria-label="3D 해저 탐험">
      <canvas id="ocean" aria-label="실시간 해저 화면"></canvas>
      <div class="shade" aria-hidden="true"></div>
      <div class="corner tl" aria-hidden="true"></div><div class="corner tr" aria-hidden="true"></div>
      <div class="corner bl" aria-hidden="true"></div><div class="corner br" aria-hidden="true"></div>

      <div class="scene-info" aria-live="polite">
        <span class="signal"></span><span id="scene-label">켈프 숲</span>
      </div>

      <div class="intro" id="intro">
        <p class="eyebrow"><span></span> 잔광 해역</p>
        <h1>Afterlight</h1>
        <p class="intro-copy">햇빛이 잦아드는 바다 아래,<br>세 곳의 해역을 자유롭게 유영하세요.</p>
        <button type="button" class="dive" id="dive" disabled><span class="dive-icon" aria-hidden="true">⌄</span><span id="dive-label">해역 준비 중</span></button>
        <p id="status" role="status" hidden></p>
      </div>

      <div class="telemetry">
        <div class="compass" aria-hidden="true"><span>N</span><i id="needle"></i></div>
        <div><span class="reading-label">현재 수심</span><strong id="depth">11.0 <small>m</small></strong></div>
      </div>

      <div class="active-tools" id="active-tools" hidden>
        <button class="quiet return" id="pause" type="button">탐험 화면 닫기 <kbd>Esc</kbd></button>
        <p class="swim-hint">드래그로 시점 이동<span> · </span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 유영</p>
      </div>
      <div class="touch" id="touch" hidden>
        <button type="button" data-key="KeyW" aria-label="전진">↑</button>
        <button type="button" data-key="KeyS" aria-label="후진">↓</button>
        <button type="button" data-key="KeyE" aria-label="상승">＋</button>
        <button type="button" data-key="KeyQ" aria-label="하강">−</button>
      </div>
    </section>

    <nav class="stations" aria-label="탐험 지점">
      <button type="button" class="station" data-zone="0" aria-current="true" disabled>
        <span class="station-icon seaweed" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 27C21 20 10 16 16 5M10 27C10 20 5 18 6 11M22 27C22 19 28 18 26 9M8 27h17"/></svg></span>
        <span class="station-text"><strong>켈프 숲</strong><span>KELP CANOPY</span></span><kbd>1</kbd>
      </button>
      <button type="button" class="station" data-zone="1" disabled>
        <span class="station-icon coral" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 27V9m0 11-7-5v-5m7 13 8-8v-5m-8 4 4-5V5m-4 12-5-8M8 27h17"/></svg></span>
        <span class="station-text"><strong>산호 능선</strong><span>CORAL RIDGE</span></span><kbd>2</kbd>
      </button>
      <button type="button" class="station" data-zone="2" disabled>
        <span class="station-icon jelly" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 16a10 10 0 0 1 20 0ZM11 18c-3 4 3 5 0 9m5-9c3 4-3 5 0 9m5-9c-3 4 3 5 0 9"/></svg></span>
        <span class="station-text"><strong>해파리 분지</strong><span>JELLY BASIN</span></span><kbd>3</kbd>
      </button>
    </nav>
  </main>

  <dialog id="controls" aria-labelledby="controls-title">
    <form method="dialog">
      <button class="quiet close" value="close" aria-label="조작법 닫기">×</button>
      <h2 id="controls-title">잠수 조작법</h2>
      <dl>
        <div><dt>둘러보기</dt><dd>화면 드래그 또는 방향키</dd></div>
        <div><dt>유영</dt><dd><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></dd></div>
        <div><dt>상승 · 하강</dt><dd><kbd>E</kbd> <kbd>Q</kbd></dd></div>
        <div><dt>빠르게 유영</dt><dd><kbd>Shift</kbd></dd></div>
        <div><dt>탐험 지점 이동</dt><dd><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dd></div>
        <div><dt>소리 켜기 · 끄기</dt><dd><kbd>M</kbd></dd></div>
      </dl>
      <p>터치 화면에서는 드래그로 둘러보고 하단 버튼으로 이동합니다.</p>
      <button class="dive" value="close">확인</button>
    </form>
  </dialog>
  <script type="module" src="/afterlight/src/main.mjs"></script>
</body>
</html>
